name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g., v1.1.0)"
        required: true
        default: "v1.1.0"
      draft:
        description: "Create draft release"
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false
      publish_pypi:
        description: "Publish package to PyPI via Trusted Publishing"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Job 1 — Build Core Package Distribution
  # ─────────────────────────────────────────────────────────────────────
  build-core:
    name: "Build Core Distribution"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install build tooling
        run: |
          pip install --upgrade pip build wheel setuptools

      - name: Build wheel and source distribution
        run: |
          python -m build --sdist --wheel --outdir dist/
          ls -la dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────
  # Job 2 — Package Agent Skills Separately
  # ─────────────────────────────────────────────────────────────────────
  package-skills:
    name: "Package Agent Skills Separately"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag is: $TAG"

      - name: Create Skill Release Bundles
        run: |
          mkdir -p release-skills
          TAG="${{ steps.vars.outputs.tag }}"

          # 1. Package the Science Explainer Shorts skill as standalone archive
          cd .agents/skills
          zip -r "../../release-skills/bengali-science-explainer-skill-${TAG}.zip" bengali-science-explainer/
          tar -czf "../../release-skills/bengali-science-explainer-skill-${TAG}.tar.gz" bengali-science-explainer/
          cd ../..

          # 2. Package all agent skills as full bundle
          cd .agents
          zip -r "../release-skills/cineforge-agent-skills-${TAG}.zip" skills/
          tar -czf "../release-skills/cineforge-agent-skills-${TAG}.tar.gz" skills/
          cd ..

          # 3. Generate SHA256 checksums
          cd release-skills
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Upload Skills Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-skills
          path: release-skills/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────
  # Job 3 — Create GitHub Release & Publish Assets
  # ─────────────────────────────────────────────────────────────────────
  publish-release:
    name: "Publish GitHub Release"
    needs: [build-core, package-skills]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download Core Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: release-assets/

      - name: Download Skill Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-skills
          path: release-assets/

      - name: Generate Consolidated Checksums
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          echo "=== Release Assets & Checksums ==="
          cat SHA256SUMS.txt
          cd ..

      - name: Generate Release Notes
        id: release_notes
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cat << 'EOF' > RELEASE_NOTES.md
          ## 🎬 CineForge Release ${TAG}

          Autonomous AI Film & Video Production System — **187 production tools** across **32 capabilities**, **14 governed pipelines**, PyPI CLI, Smart Hybrid MCP server, and Backlot Control Room.

          ### 🌟 Highlights & New Features

          - **Patch Fixes (v0.3.2)**: Aligned all 7 curated `cineforge-mcp` media/analysis wrapper parameter schemas (`tts_selector`, `image_selector`, `video_selector`, `video_compose`, `video_analyzer`, `transcriber`, `video_quality_enhancer`), rejected invalid `cineforge mcp run --transport` flags cleanly, updated `edge_tts` default voice to `en-US-AndrewNeural` with short-locale routing & `en-US-AriaNeural` fallback on `NoAudioReceived`, plus `backlot` typing cleanup.
          - **Patch Fixes (v0.3.1)**: Live `*`-masked terminal echo & bracketed-paste cleanup on `cineforge setup` API key prompts (`--show-keys` option + interrupt-safe `.env` persistence), CLI validation/escaping across `tools run/list`, `doctor`, `pipelines`, and `mcp config`, plus MCP project-ID traversal guards and structured `GATE VIOLATION` JSON error responses.
          - **Unified CLI (`cineforge`)**: Interactive `setup`, `doctor --check-keys` diagnostics, Rich `tools info` / `pipelines show`, zero-key `demo` rendering, `studio`, and `backlot`.
          - **Smart Hybrid MCP Server (`cineforge-mcp`)**: Supports `stdio` and `streamable-http` transports with curated core workflows plus dynamic execution across all 187 tools (`--all-tools`, `--profile`).
          - **Automatic IDE Detection & Interactive MCP Installer**: `cineforge mcp detect` and interactive `cineforge mcp install` auto-detect installed IDEs/CLIs (`claude`, `claude-code`, `cursor`, `antigravity`, `windsurf`, `vscode`, `opencode`, `gemini-cli`, `codex`), ask global vs project scope, merge configs safely with `.bak` backups, and optionally install matching agent skills.
          - **PyPI Packaging, Docker & 1-Line Installers**: Clean `uv tool install cineforge` / `pip install cineforge` isolation with `~/.cineforge` workspace separation, `docker-compose.yml`, plus `install.sh` / `install.ps1`.
          - **Dedicated `edge_tts` Neural TTS & Python 3.10–3.15 Matrix**: Dedicated `edge_tts` tool and full compatibility verified across Python 3.10–3.15 (2,606 passing tests).

          ### 📦 Standalone Agent Skill Packages
          Download and install the agent skills separately without the full core repository:
          - `bengali-science-explainer-skill-${TAG}.zip` — Standalone Science Explainer Shorts skill.
          - `cineforge-agent-skills-${TAG}.zip` — Complete CineForge Layer 3 agent skills fleet.

          ### 🚀 Quick Start
          ```bash
          # Recommended global CLI + MCP install via uv
          uv tool install cineforge
          cineforge setup

          # Auto-detect IDEs and install CineForge MCP interactively
          cineforge mcp install
          ```
          EOF
          # Substitute tag variable
          sed -i "s/\${TAG}/$TAG/g" RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          DRAFT_FLAG=""
          PRE_FLAG=""

          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            PRE_FLAG="--prerelease"
          fi

          echo "Publishing release for tag: $TAG"
          gh release create "$TAG" release-assets/* \
            --title "CineForge $TAG" \
            --notes-file RELEASE_NOTES.md \
            $DRAFT_FLAG $PRE_FLAG || \
          gh release edit "$TAG" \
            --title "CineForge $TAG" \
            --notes-file RELEASE_NOTES.md \
            $DRAFT_FLAG $PRE_FLAG

  # ─────────────────────────────────────────────────────────────────────
  # Job 4 — Publish Package to PyPI (Trusted Publishing / OIDC)
  # ─────────────────────────────────────────────────────────────────────
  publish-pypi:
    name: "Publish to PyPI"
    needs: [build-core, publish-release]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cineforge
    permissions:
      id-token: write
    steps:
      - name: Download Core Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
