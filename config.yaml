# CineForge - Global Configuration

llm:
  provider: anthropic            # anthropic | openai | gemini | openrouter | groq | ollama | mistral | minimax
  model: null                    # null = use provider default (e.g. google/gemini-2.0-flash-exp:free or meta-llama/llama-3.3-70b-instruct:free on openrouter)
  temperature: 0.7
  max_tokens: 8192
  stage_temperature_overrides:
    research: 0.85
    proposal: 0.80
    script: 0.60
    scene_plan: 0.55
    assets: 0.30
    edit: 0.20
    compose: 0.10

budget:
  mode: warn                     # observe | warn | cap
  total_usd: 10.00
  reserve_pct: 0.10              # holdback for retries / cleanup
  single_action_approval_usd: 0.50
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative
  storage_dir: pipeline          # relative to project root

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output
